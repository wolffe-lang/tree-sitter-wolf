name: CI
on:
  push: {branches: [trunk]}
  pull_request:
jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci || npm install
      - name: generated parser is current
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/ || { echo "::error::regenerate the parser: npx tree-sitter generate"; exit 1; }
      - name: corpus tests
        run: npx tree-sitter test
